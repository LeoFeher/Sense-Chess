<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Senseless Chess | DEV</title><style>body{background:#11151c;color:#eee;font:16px system-ui;max-width:1100px;margin:40px auto;padding:16px}h1,h2{color:#f5d48c}.panel,section{background:#222b38;padding:20px;border:1px solid #465164;border-radius:12px;margin:16px 0}button,input,select{padding:10px;margin:5px;border-radius:7px;border:1px solid #667;background:#18212d;color:white}button{background:#f5d48c;color:#111;cursor:pointer;font-weight:bold}td{padding:8px;border-bottom:1px solid #465164}label{display:inline-block} [hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><h1>♛ DEV CONTROL CENTER</h1><section><p id="status">Berechtigung wird geprüft …</p><input id="email" type="email" placeholder="Developer E-Mail"><input id="password" type="password" placeholder="Passwort"><button id="login">Anmelden</button><button id="logout">Abmelden</button></section><main id="controls" hidden><section><h2>Spielerverwaltung</h2><input id="query" placeholder="Name oder ID"><button id="reload">Aktualisieren</button><select id="player"></select><p id="details"></p><input id="amount" type="number" min="1" max="1000000" value="100"><button id="give">Pawns schenken</button><p>Weitere Änderungen benötigen eine serverseitige Erweiterung des Spielkontos.</p></section><section><h2>Bot-Geschwindigkeit</h2><select id="speed"><option value="1200">Langsam</option><option value="450" selected>Normal</option><option value="200">Schnell</option></select><p>Geschwindigkeit vor dem Start auswählen. Nur ein DEV-Tab sollte die Liga gleichzeitig betreiben.</p></section></main><script>
const $=id=>document.getElementById(id);const onlineClient=supabase.createClient('https://ztmpliszfixjabtzkkch.supabase.co','sb_publishable_GBbwup2QdFrR8tRY7gBPNg_qWJ6IgAU');let aiDevAllowed=false,players=[];const msg=t=>$('status').textContent=t;async function verify(){const {data,error}=await onlineClient.rpc('chess_dev_allowed');aiDevAllowed=!error&&data===true;$('controls').hidden=!aiDevAllowed;return aiDevAllowed;}async function refresh(){if(!await verify())throw Error('Keine DEV-Berechtigung');const {data,error}=await onlineClient.from('leaderboard').select('id,username,icon,pawns,wins,losses,bosses_defeated').order('username');if(error)throw error;players=data;fill();}function fill(){const q=$('query').value.toLowerCase();$('player').replaceChildren();for(const p of players.filter(p=>(p.username+' '+p.id).toLowerCase().includes(q)))$('player').add(new Option(p.username+' · '+p.pawns+' P',p.id));details();}function details(){const p=players.find(p=>p.id===$('player').value);$('details').textContent=p?`${p.wins} Siege · ${p.losses} Niederlagen · ${p.pawns} Pawns · Icon: ${p.icon}`:'Kein Spieler';}async function init(){try{if(!await verify()){msg('Keine DEV-Berechtigung. Mit berechtigtem Konto anmelden oder dieselbe Website-Origin wie das Spiel verwenden.');return;}await refresh();await window.loadBots();msg('DEV-Zugriff bestätigt.');}catch(e){msg(e.message);}}$('query').oninput=fill;$('player').onchange=details;$('reload').onclick=()=>refresh().catch(e=>msg(e.message));$('login').onclick=async()=>{const {error}=await onlineClient.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)msg(error.message);else await init();};$('logout').onclick=async()=>{aiDevAllowed=false;$('controls').hidden=true;await onlineClient.auth.signOut();msg('Abgemeldet');};$('give').onclick=async()=>{try{if(!await verify())throw Error('Keine DEV-Berechtigung');const n=Number($('amount').value);if(!Number.isInteger(n)||n<1||n>1000000||!$('player').value)throw Error('Ungültige Eingabe');const {error}=await onlineClient.rpc('chess_dev_give',{p_player:$('player').value,p_amount:n});if(error)throw error;msg('Pawns geschenkt');await refresh();}catch(e){msg(e.message);}};setInterval(()=>verify().catch(()=>{aiDevAllowed=false;$('controls').hidden=true;}),15000);

(()=>{
const panel=document.createElement('section');panel.className='panel';panel.style.margin='20px auto';panel.innerHTML='<h2>🤖 AI League — 12 bots</h2><p class="hint">Local autonomous players · separate wallets · actual simulated matches · no secret codes</p><button class="btn" id="aiToggle">Start AI league</button><div id="aiTable" style="overflow:auto;margin-top:12px"></div>';document.getElementById("controls").append(panel);panel.insertAdjacentHTML('beforeend','<p id="aiSync" role="status"></p>');
const names=['Nova','Pixel','Rook','Echo','Orbit','Vortex','Milo','Quartz','Nimbus','Atlas','Byte','Zen'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const catalog=[['default',0,'♟'],['knight',80,'♞'],['crown',150,'♚'],['cat',200,'🐱'],['gold',300,'🪙'],['shopkeeper',450,'🏪']];
let bots=names.map((name,i)=>({name,wins:0,losses:0,draws:0,pawns:0,owned:['default'],profile:'default',next:0,skill:i}));
try{const saved=JSON.parse(localStorage.getItem('senselessAILeagueV1'));if(Array.isArray(saved)&&saved.length===12)bots=saved;}catch(e){}
const SIZE=8,cheatsEnabled=true,isShopBoss=()=>false,isMauziFinal=()=>false,inB=(r,c)=>r>=0&&c>=0&&r<SIZE&&c<SIZE;
function getMoves(r,c,b=board){let p=b[r][c];if(!p||p.type==="wall")return[];let a=[];function add(y,x,extra){if(inB(y,x)&&(b[y][x]?.type!=="wall"&&(!b[y][x]||b[y][x].side!==p.side)))a.push({r:y,c:x,...extra});}function ray(dirs){for(let [dy,dx] of dirs){let y=r+dy,x=c+dx;while(inB(y,x)){if(!b[y][x])a.push({r:y,c:x});else{if(b[y][x].type!=="wall"&&b[y][x].side!==p.side)a.push({r:y,c:x});break;}y+=dy;x+=dx;}}}
const diag=[[1,1],[1,-1],[-1,1],[-1,-1]],straight=[[1,0],[-1,0],[0,1],[0,-1]];
if(p.type==='n'){if(p.side==='b'&&cheatsEnabled&&!isShopBoss()){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(dy||dx)add(r+dy,c+dx);}else for(let [dy,dx] of [[1,2],[1,-2],[-1,2],[-1,-2],[2,1],[2,-1],[-2,1],[-2,-1]])add(r+dy,c+dx);}
if(p.type==='s')for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(dy||dx)add(r+dy,c+dx);
if(isShopBoss()&&p.side==='w'&&p.type==='k'){ray(straight);ray(diag);return a;}if(['k','m','l'].includes(p.type))for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dy||dx)add(r+dy,c+dx);
if(p.type==='r'||p.type==='q'||p.type==='t'||p.type==='u')ray(straight);if((p.type==='t'||p.type==='u')&&cheatsEnabled)for(let [dy,dx] of diag)add(r+dy,c+dx);if(p.type==='b'||p.type==='q')ray(diag);
if(isMauziFinal()&&p.side==='w'&&p.type==='p'){for(let dy=1;dy<=2;dy++){if(!inB(r+dy,c)||b[r+dy][c])break;add(r+dy,c);}for(let dx of [-1,1])if(inB(r+1,c+dx)&&b[r+1][c+dx]?.side==='b')add(r+1,c+dx);for(let dx of [-1,1])if(inB(r,c+dx)&&!b[r][c+dx])add(r,c+dx);return a;}if(p.type==='p'){let d=p.side==='w'?1:-1,home=p.side==='w'?1:SIZE-2;if(inB(r+d,c)&&!b[r+d][c]){a.push({r:r+d,c});if(r===home&&!b[r+2*d][c])a.push({r:r+2*d,c});}for(let dx of [-1,1]){let x=c+dx,y=r+d;if(inB(y,x)&&b[y][x]&&b[y][x].type!=="wall"&&b[y][x].side!==p.side)a.push({r:y,c:x});if(cheatsEnabled&&p.side==='w'&&inB(r,x)&&inB(y,x)&&b[r][x]&&b[r][x].side==='b'&&!b[y][x])a.push({r:y,c:x,ep:{r,c:x}});}}
return a;}

const values={m:20000,l:20000,p:100,n:320,b:335,r:510,q:930,t:650,u:650,s:2700,k:20000,m:20000,l:20000};
function allMoves(b,side){let out=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(b[r][c]?.side===side)for(let m of getMoves(r,c,b))out.push({r,c,m});return out;}
function clone(b){return b.map(row=>row.map(p=>p?{...p}:null));}
function simulate(b,o){let n=clone(b),p=n[o.r][o.c];if(o.m.ep)n[o.m.ep.r][o.m.ep.c]=null;n[o.m.r][o.m.c]=p;n[o.r][o.c]=p.pile?.length?{...p.pile[0],pile:p.pile.slice(1)}:null;delete p.pile;if(p.type==='p'&&!(isMauziFinal()&&p.side==='w')&&(o.m.r===0||o.m.r===SIZE-1))p.type=p.side==='b'?'t':'q';return n;}
function evaluate(b){let v=0;for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){let p=b[r][c];if(!p||p.type==='wall')continue;let sign=p.side==='w'?1:-1;let center=(SIZE-1)/2-Math.abs(c-(SIZE-1)/2);let advancement=p.side==='w'?r:SIZE-1-r;v+=sign*(values[p.type]+(p.type==='p'?advancement*9+center*4:p.type==='n'||p.type==='b'?center*11:0));}return v;}
function order(b,arr){return arr.map(o=>{let target=o.m.ep?b[o.m.ep.r][o.m.ep.c]:b[o.m.r][o.m.c];return {...o,priority:(target?values[target.type]*12-values[b[o.r][o.c].type]:0)+(o.m.ep?250:0)+Math.random()*3};}).sort((a,b)=>b.priority-a.priority);}
function search(b,depth,alpha,beta,side){let score=evaluate(b);if(depth===0||Math.abs(score)>18000)return score;let options=order(b,allMoves(b,side));if(!options.length)return score;let best=side==='w'?-Infinity:Infinity;for(let o of options){let val=search(simulate(b,o),depth-1,alpha,beta,side==='w'?'b':'w');if(side==='w'){best=Math.max(best,val);alpha=Math.max(alpha,best);}else{best=Math.min(best,val);beta=Math.min(beta,best);}if(beta<=alpha)break;}return best;}

function newGame(bot){let b=Array.from({length:8},()=>Array(8).fill(null));let back='rnbqkbnr';for(let c=0;c<8;c++){for(const [r,side,type] of [[0,'w',back[c]],[1,'w','p'],[6,'b','p'],[7,'b',back[c]]])b[r][c]={side,type};}let elo=pick([400,800,1100,1500,1800,2200,1801,4000,1]);if([1801,4000,1].includes(elo))b[0][3].type='s';if([4000,1].includes(elo))for(let c=0;c<8;c++)b[1][c].type='u';if(elo===1)for(let c=0;c<8;c++)if(c!==4)b[0][c].type='s';return {b,elo,side:'b',ply:0};}
const disabled=new Set(); const games=new Map();let timer=null;
function turn(bot,g){let options=allMoves(g.b,g.side);if(!options.length)return g.side==='b'?'w':'b';let o;if(Math.random()<(g.side==='b'?.28-bot.skill*.018:Math.max(.03,.5-g.elo/5000)))o=pick(options);else{let best=-Infinity;for(const x of options){let n=simulate(g.b,x);let score=evaluate(n)*(g.side==='w'?1:-1)+Math.random()*45;if(score>best){best=score;o=x;}}}g.b=simulate(g.b,o);g.ply++;let kings=g.b.flat().filter(p=>p?.type==='k');if(!kings.some(p=>p.side==='w'))return 'b';if(!kings.some(p=>p.side==='b'))return 'w';if(g.ply>=160)return 'draw';g.side=g.side==='b'?'w':'b';return null;}
function tick(){if(!aiDevAllowed){clearInterval(timer);timer=null;return;}for(const bot of bots){if(disabled.has(bot.name)||Date.now()<bot.next)continue;let g=games.get(bot.name);if(!g){g=newGame(bot);games.set(bot.name,g);}for(let i=0;i<3;i++){let result=turn(bot,g);if(!result)continue;if(result==='b'){bot.wins++;bot.pawns+=({400:40,800:80,1100:110,1500:150,1800:180,2200:220,1801:250,4000:600,1:5})[g.elo];}else if(result==='w')bot.losses++;else bot.draws++;games.delete(bot.name);bot.next=Date.now()+1000+Math.random()*18000;let affordable=catalog.filter(a=>a[1]>0&&a[1]<=bot.pawns&&!bot.owned.includes(a[0]));if(affordable.length&&Math.random()<.65){let a=pick(affordable);bot.pawns-=a[1];bot.owned.push(a[0]);}if(Math.random()<.45)bot.profile=pick(bot.owned);break;}}save();draw();publish();}
function save(){try{localStorage.setItem('senselessAILeagueV1',JSON.stringify(bots));}catch(e){}}
let publishing=false,lastPublish=0; async function publish(){if(!aiDevAllowed||!onlineClient||publishing||Date.now()-lastPublish<15000)return;publishing=true;lastPublish=Date.now();try{const rows=bots.map(b=>({name:b.name,profile:b.profile,pawns:b.pawns,wins:b.wins,losses:b.losses,bosses:0}));const {error}=await onlineClient.rpc('chess_ai_publish',{p_rows:rows});if(error)throw error;panel.querySelector('#aiSync').textContent='Global ranking synced';}catch(e){panel.querySelector('#aiSync').textContent='Sync unavailable: '+e.message;}finally{publishing=false;}}
function draw(){let root=panel.querySelector('#aiTable');root.replaceChildren();let t=document.createElement('table');t.style.cssText='width:100%;text-align:left;font-size:13px';for(const row of [['Bot','Wins','Losses','Draws','Pawns','Activity'],...bots.map(b=>[(catalog.find(a=>a[0]===b.profile)||catalog[0])[2]+' '+b.name,b.wins,b.losses,b.draws,b.pawns,games.has(b.name)?'Playing '+games.get(b.name).elo+' Elo · '+games.get(b.name).ply:'Waiting'])]){let tr=t.insertRow();for(const v of row)tr.insertCell().textContent=v;}root.append(t); for(const b of bots){const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!disabled.has(b.name);cb.onchange=()=>cb.checked?disabled.delete(b.name):disabled.add(b.name);label.append(cb,b.name+' ');root.append(label);}}
window.loadBots=async()=>{const {data,error}=await onlineClient.from("chess_ai_public").select("*");if(error)throw error;for(const row of data){const b=bots.find(x=>x.name===row.name);if(b){Object.assign(b,{wins:row.wins,losses:row.losses,pawns:row.pawns,profile:row.profile});if(!b.owned.includes(row.profile))b.owned.push(row.profile);}}save();draw();};panel.querySelector('#aiToggle').onclick=()=>{if(!aiDevAllowed)return;if(timer){clearInterval(timer);timer=null;}else timer=setInterval(tick,Number(document.getElementById("speed").value));panel.querySelector('#aiToggle').textContent=timer?'Pause AI league':'Start AI league';draw();};draw();
})();

init();</script></html>
